name: 生成金属价格月报

on:
  workflow_dispatch:
  schedule:
    # 每月 5 日北京时间 09:00（UTC 01:00）
    - cron: "0 1 5 * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成图表
        run: python src/generate_charts.py

      - name: 生成报告
        run: python src/generate_report.py

      - name: 提交生成结果
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase origin main

          git add public data/processed

          if git diff --cached --quiet; then
            echo "没有需要提交的生成结果。"
          else
            git commit -m "自动生成金属价格月报"
            git push origin main
          fi

      - name: 发送 Bark 推送
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_BASE_URL: ${{ secrets.BARK_BASE_URL }}
          REPORT_URL: ${{ secrets.REPORT_URL }}
        run: python src/notify_bark.py
