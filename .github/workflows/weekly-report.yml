name: Weekly Metal Report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "metal-intelligence/**"
  schedule:
    # Saturday 10:00 China Standard Time, after the Friday market close.
    - cron: "0 2 * * 6"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r metal-intelligence/requirements.txt

      - name: Refresh, validate, and render
        run: python metal-intelligence/src/run_weekly_pipeline.py --tin-days 365 --workers 8

      - name: Deploy weekly page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./metal-intelligence/public
          publish_branch: gh-pages
          destination_dir: metal-intelligence
          keep_files: true
          commit_message: "部署：更新金属市场周报"

      - name: Upload weekly outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-weekly-${{ github.run_number }}
          path: |
            metal-intelligence/data/processed/*.json
            metal-intelligence/reports/*.json
            metal-intelligence/public/weekly/index.html

      - name: Send Bark notification
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_BASE_URL: ${{ secrets.BARK_BASE_URL }}
          WEEKLY_REPORT_URL: https://seeln-la.github.io/metal-price-report/metal-intelligence/weekly/index.html
        run: python metal-intelligence/src/notify_weekly_bark.py
